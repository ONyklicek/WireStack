services:

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached

    command: sleep infinity

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailpit

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest

    restart: unless-stopped

    ports:
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
