[xdebug]
; Debugging only on request (XDEBUG_TRIGGER / the browser extension), so Pest
; does not pay for a debugger on every run. The base image ships
; `start_with_request = yes`, which this overrides.
;
; Coverage is off by default too, it slows every test run. For the coverage
; gate: XDEBUG_MODE=coverage composer coverage:verify
xdebug.mode = debug
xdebug.start_with_request = trigger

; VS Code's PHP Debug extension runs inside the container, so it listens on the
; container's own loopback.
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
xdebug.discover_client_host = 0

xdebug.log_level = 0
