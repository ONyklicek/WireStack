name: CI

# One workflow, one matrix, every gate.
#
# This file replaces tests.yml, database-tests.yml, coverage.yml and
# static-analysis.yml. They had drifted into four different answers to the same
# four questions — which branches, which PHP, which extensions, which install
# command — and the drift was the bug: coverage.yml's push gate named `2.x`, a
# branch that was never cut, so the floors only ever ratcheted on pull requests,
# and static-analysis.yml ran on `main` only for long enough that three gates
# sat dark through an entire release line while reading as green.
#
# Every leg is now one `include` entry below. Adding a gate means adding a row,
# not a file, and a row cannot quietly disagree with the others about when it
# runs.
#
# The legs are deliberately written out rather than generated from a `php` ×
# `laravel` product plus `exclude`. A cartesian base cannot be mixed with
# `include` rows for the database, coverage and static legs without relying on
# GitHub's merge rules — an `include` entry is appended as a new combination
# only when it *conflicts* with an original key, so the database rows would have
# to carry a deliberately wrong `laravel` value to avoid being folded into all
# six compatibility legs. Six explicit rows beat that.

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The floor every leg gets. Database legs append their driver, and nothing
  # subtracts: the static legs do not need pdo_sqlite, but composer refuses to
  # install at all when openspout's fileinfo/xmlreader or dompdf's dom/mbstring
  # are missing, so the shared list is the one that resolves everywhere.
  PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, xmlreader

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── Compatibility ────────────────────────────────────────────────
          #
          # 8.2 is the floor every manifest declares (`"php": "^8.2"`), so it is
          # tested rather than assumed: the matrix used to start at 8.3 and two
          # packages had quietly grown PHP 8.3 syntax — typed class constants in
          # the install scaffolds — which parsed everywhere CI looked and fataled
          # on the first `wire-*:install` an 8.2 application ran. A declared floor
          # nothing runs is not a floor.
          #
          # Laravel 13 requires PHP ^8.3, so it has no 8.2 leg; 8.3 is left on 12
          # to keep the product from growing a leg per cell.
          - name: PHP 8.2 – Laravel 12.*
            php: '8.2'
            laravel: '12.*'
            run: vendor/bin/pest

          - name: PHP 8.3 – Laravel 12.*
            php: '8.3'
            laravel: '12.*'
            run: vendor/bin/pest

          - name: PHP 8.4 – Laravel 12.*
            php: '8.4'
            laravel: '12.*'
            run: vendor/bin/pest

          - name: PHP 8.4 – Laravel 13.*
            php: '8.4'
            laravel: '13.*'
            run: vendor/bin/pest

          - name: PHP 8.5 – Laravel 12.*
            php: '8.5'
            laravel: '12.*'
            run: vendor/bin/pest

          - name: PHP 8.5 – Laravel 13.*
            php: '8.5'
            laravel: '13.*'
            run: vendor/bin/pest

          # ── Databases ────────────────────────────────────────────────────
          #
          # The behaviour/result-based suites (Feature + Standalone +
          # Integration — the ones that execute real queries through the
          # components) against live servers. The dialect-specific Unit suites
          # that assert exact SQL strings, and Boost's schema introspection,
          # keep running on SQLite in the compatibility legs above;
          # TableQueryServiceTest is the one Unit file that earns a real server.
          #
          # These legs start their own container (see "Start the database
          # server") instead of using `services:`. A job's `services` block is
          # not matrix-expandable — it cannot be empty for a leg — so keeping it
          # would have meant pulling and health-checking MySQL, MariaDB *and*
          # Postgres before every one of the thirteen legs, including Pint.
          - name: mysql
            php: '8.3'
            db: mysql
            port: 3306
            username: root
            extra-extensions: ', mysql, pdo_mysql'
            run: >-
              vendor/bin/pest
              packages/core/tests/Feature
              packages/forms/tests/Feature
              packages/forms/tests/Standalone
              packages/table/tests/Feature
              packages/sortable/tests/Feature
              tests/Integration
              packages/table/tests/Unit/Services/TableQueryServiceTest.php

          - name: mariadb
            php: '8.3'
            db: mariadb
            port: 3307
            username: root
            extra-extensions: ', mysql, pdo_mysql'
            run: >-
              vendor/bin/pest
              packages/core/tests/Feature
              packages/forms/tests/Feature
              packages/forms/tests/Standalone
              packages/table/tests/Feature
              packages/sortable/tests/Feature
              tests/Integration
              packages/table/tests/Unit/Services/TableQueryServiceTest.php

          - name: pgsql
            php: '8.3'
            db: pgsql
            port: 5432
            username: postgres
            extra-extensions: ', pgsql, pdo_pgsql'
            run: >-
              vendor/bin/pest
              packages/core/tests/Feature
              packages/forms/tests/Feature
              packages/forms/tests/Standalone
              packages/table/tests/Feature
              packages/sortable/tests/Feature
              tests/Integration
              packages/table/tests/Unit/Services/TableQueryServiceTest.php

          # ── Coverage ─────────────────────────────────────────────────────
          #
          # Measured once, not per compatibility leg: coverage is a property of
          # the code, not of the interpreter, so twelve slow runs would buy one
          # number. pcov is several times faster than xdebug for a coverage-only
          # run. `composer coverage:clover` carries the memory_limit=-1 that
          # building the report over ~450 source files needs — without it the
          # fatal still exits 0, a green run that measured nothing.
          #
          # Two gates follow (scripts/verify-coverage.php): no package drops
          # below its recorded floor in scripts/coverage-floors.json — hard, and
          # floors only ratchet upward — and every line a change adds or edits is
          # covered, reported as advisory. Enforcing diff coverage on a release
          # branch would demand covering the entire release, defensive paths
          # included; the per-package floors are the real ratchet.
          - name: Verify coverage
            php: '8.3'
            coverage: pcov
            run: composer coverage:clover

          # ── Static analysis ──────────────────────────────────────────────
          - name: PHPStan
            php: '8.3'
            run: vendor/bin/phpstan analyse --ansi

          # An `instanceof` against an unimported contract resolves to the
          # current namespace, does not exist, and silently returns false — a
          # seam that quietly stops working. PHPStan and Pint are both clean on
          # that code, so it needs its own gate. See ADR 0021.
          - name: instanceof imports
            php: '8.3'
            run: composer api:instanceof

          - name: Laravel Pint
            php: '8.3'
            run: vendor/bin/pint --test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Only the coverage leg needs history, and it needs all of it: the
          # diff gate walks back to the base commit.
          #
          # Written as `!= && 1 || 0` rather than the obvious `== && 0 || 1`
          # because 0 is falsy in a GitHub expression: `matrix.depth || 1` reads
          # a declared depth of 0 as "unset" and hands back 1, which is a
          # shallow clone and a coverage gate that cannot resolve its base. Only
          # the truthy value may sit on the left of the `||`.
          fetch-depth: ${{ matrix.coverage != 'pcov' && 1 || 0 }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}${{ matrix.extra-extensions }}
          coverage: ${{ matrix.coverage || 'none' }}

      - name: Pin Laravel to ${{ matrix.laravel }}
        if: matrix.laravel != ''
        run: composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" --no-interaction --no-update

      # `update`, not `install`, on every leg: composer.lock is git-ignored here,
      # so `install` would silently fall back to resolving anyway. Saying so is
      # better than relying on the fallback.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Start the database server
        if: matrix.db != ''
        run: |
          case "${{ matrix.db }}" in
            mysql)
              docker run -d --name db -p ${{ matrix.port }}:3306 \
                -e MYSQL_DATABASE=wire_test \
                -e MYSQL_ROOT_PASSWORD=password \
                mysql:8.0
              probe='mysqladmin ping -h 127.0.0.1 -ppassword'
              ;;
            mariadb)
              docker run -d --name db -p ${{ matrix.port }}:3306 \
                -e MARIADB_DATABASE=wire_test \
                -e MARIADB_ROOT_PASSWORD=password \
                mariadb:11
              probe='mariadb-admin ping -h 127.0.0.1 -ppassword'
              ;;
            pgsql)
              docker run -d --name db -p ${{ matrix.port }}:5432 \
                -e POSTGRES_DB=wire_test \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=password \
                postgres:16
              probe='pg_isready -U postgres'
              ;;
            *)
              echo "::error::unknown database '${{ matrix.db }}'"
              exit 1
              ;;
          esac

          # The `services:` block this replaces allowed 15 retries at 10s. The
          # probe runs inside the container, so it uses the client the image
          # already ships rather than one the runner would have to install.
          for _ in $(seq 1 75); do
            if docker exec db sh -c "$probe" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::${{ matrix.db }} was not ready within 150s"
          docker logs db
          exit 1

      - name: ${{ matrix.name }}
        env:
          # phpunit.xml's <env> entries do not force, so a real environment
          # variable wins — which is how a leg swaps the in-memory SQLite the
          # file declares for a live server. Non-database legs must therefore
          # fall back to exactly what phpunit.xml would have set; an empty
          # DB_CONNECTION is still a set DB_CONNECTION.
          DB_CONNECTION: ${{ matrix.db || 'sqlite' }}
          DB_DATABASE: ${{ matrix.db && 'wire_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
        run: ${{ matrix.run }}

      - name: Resolve the diff base
        if: matrix.coverage == 'pcov'
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # A new branch, a force push or a manual dispatch has no usable
            # "before"; the floors still apply, the diff simply has nothing to
            # compare against.
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce coverage floors
        if: matrix.coverage == 'pcov'
        run: php scripts/verify-coverage.php build/clover.xml

      - name: Report diff coverage (advisory)
        if: matrix.coverage == 'pcov' && steps.base.outputs.ref != ''
        continue-on-error: true
        run: php scripts/verify-coverage.php build/clover.xml --diff="${{ steps.base.outputs.ref }}"

      - name: Upload the coverage report
        if: always() && matrix.coverage == 'pcov'
        uses: actions/upload-artifact@v7
        with:
          name: clover-coverage
          path: build/clover.xml
          retention-days: 7
          if-no-files-found: warn
