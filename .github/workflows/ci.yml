name: CI

# One workflow, one run, the same blocks that used to be four files.
#
# This replaces tests.yml, database-tests.yml, coverage.yml and
# static-analysis.yml. Each stays its own job — a failure still names itself,
# and the database servers, the coverage tooling and the PHP × Laravel product
# each keep the shape that suits them — but they now share one trigger, one
# permission set and one extension list. That sharing is the point: four files
# had drifted into four different answers to the same questions, and the drift
# was the bug. coverage.yml's push gate named `2.x`, a branch that was never
# cut, so the floors only ever ratcheted on pull requests; static-analysis.yml
# ran on `main` alone for long enough that three gates sat dark through an
# entire release line while reading as green.
#
# Adding a gate means adding a job here, not a file that can disagree about when
# it runs.

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The one list, so it cannot drift per job. Composer refuses to install at all
  # when a required extension is missing — openspout needs fileinfo and
  # xmlreader, dompdf needs dom and mbstring — and PHPStan needs them present
  # rather than merely resolvable, since it analyses the exporters against those
  # libraries' real signatures now that the hand-written stub file is gone. The
  # database job appends its driver on top.
  PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, xmlreader

jobs:

  # ── Compatibility ──────────────────────────────────────────────────────────

  tests:
    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor every manifest declares (`"php": "^8.2"`), so it is
        # tested rather than assumed: the matrix used to start at 8.3 and two
        # packages had quietly grown PHP 8.3 syntax — typed class constants in
        # the install scaffolds — which parsed everywhere CI looked and fataled
        # on the first `wire-*:install` an 8.2 application ran. A declared floor
        # nothing runs is not a floor.
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        exclude:

          # Laravel 13 requires PHP ^8.3, so its 8.2 leg cannot resolve.
          - php: '8.2'
            laravel: '13.*'

          - php: '8.3'
            laravel: '13.*'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Adjust Laravel version
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  # ── Databases ──────────────────────────────────────────────────────────────

  database:
    # Runs the behaviour/result-based suites (Feature + Standalone + Integration
    # — which execute real queries through the components) against live MySQL,
    # MariaDB and PostgreSQL servers. The dialect-specific Unit suites that
    # assert exact SQL strings keep running on SQLite in the `tests` job above.
    name: ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
            driver: mysql, pdo_mysql
          - db: mariadb
            port: 3307
            username: root
            driver: mysql, pdo_mysql
          - db: pgsql
            port: 5432
            username: postgres
            driver: pgsql, pdo_pgsql

    # All three start on every leg: a `services` block is not matrix-expandable,
    # so it cannot be narrowed to the one server the leg actually dials.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wire_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: wire_test
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}, ${{ matrix.driver }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Behaviour/result-based tests that execute real queries (search, filters,
      # sorting, exports, CRUD) — these are dialect-agnostic and validate the
      # generated SQL against each server. The SQL-string Unit suites (exact
      # toSql/toRawSql assertions) and Boost's schema-introspection tests stay on
      # SQLite in the `tests` job.
      - name: Run behaviour tests against ${{ matrix.db }}
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: wire_test
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
        run: >-
          vendor/bin/pest
          packages/core/tests/Feature
          packages/forms/tests/Feature
          packages/forms/tests/Standalone
          packages/table/tests/Feature
          packages/sortable/tests/Feature
          tests/Integration
          packages/table/tests/Unit/Services/TableQueryServiceTest.php

  # ── Coverage ───────────────────────────────────────────────────────────────

  coverage:
    # Measured once, not per compatibility leg: the `tests` job runs a PHP ×
    # Laravel product with `coverage: none`, because compatibility is what that
    # product is for. Coverage is a property of the code, not of the
    # interpreter, so measuring it there would cost twelve slow runs to learn
    # one number.
    #
    # Two gates (scripts/verify-coverage.php): no package drops below its
    # recorded floor in scripts/coverage-floors.json — hard, and floors only
    # ratchet upward — and every line a change adds or edits is covered,
    # reported as advisory. Enforcing diff coverage on a release branch would
    # demand covering the entire release, including defensive and edge paths
    # that are deliberately left; the per-package floors are the real ratchet.
    #
    # Laravel is left at its default: wire-boost depends on laravel/mcp and is
    # dropped from older matrix legs, and a run without it could not gate it.
    name: Verify coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The diff gate needs the history back to the base commit.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          # pcov is several times faster than xdebug for a coverage-only run.
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Generate coverage report
        # memory_limit=-1: building the report over ~450 source files exhausts
        # the default limit, and the resulting fatal still exits 0 — a green
        # run that measured nothing. `composer coverage:clover` carries it.
        run: composer coverage:clover

      - name: Resolve the diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # A new branch, a force push or a manual dispatch has no usable
            # "before"; the floors still apply, the diff simply has nothing to
            # compare against.
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce coverage floors
        run: php scripts/verify-coverage.php build/clover.xml

      - name: Report diff coverage (advisory)
        if: ${{ steps.base.outputs.ref != '' }}
        continue-on-error: true
        run: php scripts/verify-coverage.php build/clover.xml --diff="${{ steps.base.outputs.ref }}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clover-coverage
          path: build/clover.xml
          retention-days: 7
          if-no-files-found: warn

  # ── Static analysis ────────────────────────────────────────────────────────

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --ansi

  instanceof:
    # An `instanceof` against an unimported contract resolves to the current
    # namespace, does not exist, and silently returns false — a seam that quietly
    # stops working. PHPStan and Pint are both clean on that code, so it needs its
    # own gate. See ADR 0021.
    name: instanceof imports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Verify every instanceof target resolves
        run: composer api:instanceof

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test
