name: Static Analysis

# Every branch, deliberately — matching tests.yml rather than naming branches.
# This file gates PHPStan, the ADR-0021 `instanceof` check and Pint, and it used
# to trigger on `main` only. Release work happens on a version branch (`2.0.0`,
# `1.x`), so all three gates were dark for an entire release line while reading
# as green, and a named-branch list is a thing that goes stale exactly when a new
# release branch is cut. A wildcard cannot.
on:
  push:
    branches:
        - "*"
  pull_request:
    branches:
        - "*"

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # These jobs install dev dependencies, and composer refuses to
          # install at all when a required extension is missing: openspout
          # needs fileinfo and xmlreader, dompdf needs dom and mbstring. The
          # first job also needs them present rather than merely resolvable —
          # PHPStan analyses the exporters against the libraries' real
          # signatures now that the hand-written stub file is gone.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, xmlreader
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --ansi

  # An `instanceof` against an unimported contract resolves to the current
  # namespace, does not exist, and silently returns false — a seam that quietly
  # stops working. PHPStan and Pint are both clean on that code, so it needs its
  # own gate. See ADR 0021.
  instanceof:
    name: instanceof imports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # These jobs install dev dependencies, and composer refuses to
          # install at all when a required extension is missing: openspout
          # needs fileinfo and xmlreader, dompdf needs dom and mbstring. The
          # first job also needs them present rather than merely resolvable —
          # PHPStan analyses the exporters against the libraries' real
          # signatures now that the hand-written stub file is gone.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, xmlreader
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify every instanceof target resolves
        run: composer api:instanceof

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # These jobs install dev dependencies, and composer refuses to
          # install at all when a required extension is missing: openspout
          # needs fileinfo and xmlreader, dompdf needs dom and mbstring. The
          # first job also needs them present rather than merely resolvable —
          # PHPStan analyses the exporters against the libraries' real
          # signatures now that the hand-written stub file is gone.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, xmlreader
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test
