name: Deploy Docs Site

# Assembles the full docs matrix — every available version (built from its own
# git branch) x every configured locale — into a single dist/ tree and publishes
# it to the external GitHub Pages repo NyonCode/wire-stack.github.io.
#
# Why one job builds everything: the site is published with force_orphan, so a
# per-branch deploy would orphan-wipe the other version. A single assembler that
# lays every (version, locale) cell into one tree (each cell owns a disjoint
# sub-directory, see docs-site/build.php) is the only clobber-safe design.
#
# The version -> branch and the locale matrix live in docs-site/config.json,
# which is fed to every per-branch build via DOCS_VERSIONS_FILE so the version
# and language switchers can never drift between branches. Keep config.json in
# sync across branches (it is the single source of truth the deploy reads).
#
# One-time setup:
#   1. Reuse the existing SPLIT_TOKEN secret (a PAT with write access to the
#      NyonCode org) able to push to NyonCode/wire-stack.github.io.
#   2. (Optional) add TORCHLIGHT_TOKEN secret; otherwise the token committed
#      in torchlight.config.cjs is used.
#   3. In NyonCode/wire-stack.github.io -> Settings -> Pages -> "Deploy from a
#      branch" -> branch: gh-pages, folder: / (root).

on:
  push:
    branches: [1.x, 2.x]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'torchlight.config.cjs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & publish docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for cross-branch worktrees)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install npm dependencies (Torchlight CLI)
        run: npm install --no-audit --no-fund

      # The docs build is verified separately by docs-check.yml (runs on PRs and
      # pushes). This workflow only assembles and publishes.
      - name: Assemble the version x locale matrix
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/_site"
          CONFIG="$GITHUB_WORKSPACE/docs-site/config.json"
          CANON="$RUNNER_TEMP/docs-config.json"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          # Freeze one canonical config for every per-branch build so switchers
          # stay identical no matter which branch the build runs from.
          cp "$CONFIG" "$CANON"
          export DOCS_VERSIONS_FILE="$CANON"
          export DOCS_DIST_DIR="$DIST"

          locales=$(jq -r '.locales[].code' "$CONFIG")

          # Build each available version from its branch, all locales, into DIST.
          jq -c '.versions[] | select(.available == true)' "$CONFIG" | while read -r version; do
            label=$(echo "$version" | jq -r '.label')
            branch=$(echo "$version" | jq -r '.branch')

            if ! git rev-parse --verify --quiet "origin/$branch" >/dev/null; then
              echo "::warning::Branch origin/$branch for $label not found — skipping."
              continue
            fi

            work="$RUNNER_TEMP/wt-$branch"
            rm -rf "$work"
            git worktree add --force --detach "$work" "origin/$branch"

            echo "==> composer install ($branch)"
            composer install --working-dir="$work" --prefer-dist --no-interaction --no-progress --no-dev

            for code in $locales; do
              echo "==> build $label / $code"
              DOCS_BUILD_VERSION="$label" DOCS_BUILD_LOCALE="$code" \
                php "$work/docs-site/build.php"
            done

            git worktree remove --force "$work"
          done

          echo "Assembled matrix:"
          find "$DIST" -maxdepth 2 -name index.html | sort

      - name: Highlight code blocks (Torchlight)
        env:
          TORCHLIGHT_TOKEN: ${{ secrets.TORCHLIGHT_TOKEN }}
        run: |
          node node_modules/@torchlight-api/torchlight-cli/dist/bin/torchlight.cjs.js \
            -c torchlight.config.cjs -i "$GITHUB_WORKSPACE/_site"
          # Remove Torchlight's hidden copy-source textareas: the site copies the
          # visible code (site.js reads code.innerText), so they are dead weight
          # that also holds raw `$`-containing source — the surface behind the
          # `->prefix('$')` leak. Belt-and-suspenders alongside the pinned CLI.
          node docs-site/scripts/strip-copy-source.mjs "$GITHUB_WORKSPACE/_site"

      - name: Disable Jekyll processing
        run: touch "$GITHUB_WORKSPACE/_site/.nojekyll"

      - name: Publish to wire-stack.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SPLIT_TOKEN }}
          external_repository: NyonCode/wire-stack.github.io
          publish_dir: ./_site
          publish_branch: gh-pages
          cname: wirestack.nyoncode.cz
          force_orphan: true
          user_name: "Ondřej Nyklíček"
          user_email: "ondrejnyklicek@icloud.com"
          commit_message: 'Deploy docs from ${{ github.sha }}'
