laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  # Private-channel authorization for verifying live(broadcast: true) over a real
  # socket. Entirely inert unless a broadcast server is installed and switched on
  # — see the class. Deliberately the only entry: a broadcaster's own providers
  # are registered from inside it, when present, because naming them here would
  # make the whole workbench refuse to boot without the package installed.
  - Workbench\App\Providers\WorkbenchBroadcastServiceProvider
  # Fortify, listed rather than discovered: it is a dev dependency of the
  # monorepo, and the workbench stands in for the application that installed it.
  # After WorkbenchServiceProvider on purpose — that provider sets
  # `fortify.features` in its own register(), and Fortify reads the feature list
  # from there.
  - Laravel\Fortify\FortifyServiceProvider

migrations:
  # The workbench's own fixtures only — invoices, tasks, documents, and the users
  # table the packages' migrations hang off.
  #
  # It used to keep a copy of eleven of the packages' migrations too, and they
  # had to go: `wire:install` publishes those same files, so every table already
  # existed under a different migration name and `migrate` met each of them
  # twice. Listing the packages' own directories here instead only moved the
  # collision — the installer still publishes copies, and `migrate` then sees
  # each migration under two names rather than one. The workbench publishes them
  # instead, in the build step below, which is what an application does.
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    # Before the migration, because this is what it runs: the packages'
    # migrations, published into `database/migrations` the way an application
    # has them rather than copied into `workbench/database/migrations` where
    # they would collide with the installer publishing the same files.
    - workbench:publish-package-migrations
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
